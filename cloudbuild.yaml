options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: "europe-west1"
  _SERVICE: ""
  _AR_REPO: ""
  _IMAGE_NAME: ""
  _MODEL_ARTIFACTS_URI: ""
  _MAX_INSTANCES: "3"

steps:
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "Fetch model artifacts from GCS"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        if [ -z "${_SERVICE}" ]; then
          echo "ERROR: _SERVICE substitution is required"
          exit 1
        fi
        if [ -z "${_AR_REPO}" ]; then
          echo "ERROR: _AR_REPO substitution is required"
          exit 1
        fi
        if [ -z "${_IMAGE_NAME}" ]; then
          echo "ERROR: _IMAGE_NAME substitution is required"
          exit 1
        fi
        if [ -z "${_MODEL_ARTIFACTS_URI}" ]; then
          echo "ERROR: _MODEL_ARTIFACTS_URI substitution is required"
          exit 1
        fi
        echo "Downloading model artifacts from ${_MODEL_ARTIFACTS_URI}..."
        mkdir -p app/ml/models/fake_news
        gsutil -m rsync -r "${_MODEL_ARTIFACTS_URI}" app/ml/models/fake_news
        echo "Validating required model files..."
        test -f app/ml/models/fake_news/model.onnx
        test -f app/ml/models/fake_news/config.json
        test -f app/ml/models/fake_news/tokenizer_config.json
        test -f app/ml/models/fake_news/vocab.json
        test -f app/ml/models/fake_news/merges.txt
        test -f app/ml/models/fake_news/special_tokens_map.json

  - name: "gcr.io/cloud-builders/docker"
    id: "Warm Docker cache"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        set -euo pipefail
        docker pull "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest" || true

  - name: "gcr.io/cloud-builders/docker"
    id: "Build image"
    env:
      - "DOCKER_BUILDKIT=1"
    args:
      - "build"
      - "--build-arg"
      - "BUILDKIT_INLINE_CACHE=1"
      - "--cache-from"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$BUILD_ID"
      - "-t"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    id: "Push image (build id)"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$BUILD_ID"

  - name: "gcr.io/cloud-builders/docker"
    id: "Push image (latest)"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk:slim"
    id: "Deploy to Cloud Run"
    entrypoint: "gcloud"
    args:
      - "run"
      - "deploy"
      - "${_SERVICE}"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--image"
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$BUILD_ID"
      - "--port"
      - "8080"
      - "--cpu"
      - "2"
      - "--memory"
      - "4Gi"
      - "--concurrency"
      - "4"
      - "--timeout"
      - "300"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "${_MAX_INSTANCES}"
      - "--set-env-vars"
      - "APP_HOST=0.0.0.0,APP_PORT=8080,MODEL_DIR=/app/app/ml/models/fake_news,PRELOAD_MODELS_ON_STARTUP=false"

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:$BUILD_ID"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_IMAGE_NAME}:latest"
